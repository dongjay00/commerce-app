services:
  db:
    image: postgres:17-alpine
    container_name: commerce-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: commerce
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
